name: MongoDB Keep-Alive

on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch: {}

jobs:
  ping-mongodb:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run keep-alive
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
